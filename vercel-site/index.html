<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>KASLU LAB</title>
    <meta http-equiv="refresh" content="0; url=https://share.streamlit.io/deploy?repository=Huseynitsu/kaslu-lab&branch=main&mainModule=streamlit_app.py" />
    <script>
      (function () {
        const params = new URLSearchParams(location.search);
        const app = params.get("app");
        if (app) {
          location.replace(app);
          return;
        }
        if (params.get("stay") === "1") return;
        location.replace(
          "https://share.streamlit.io/deploy?repository=Huseynitsu/kaslu-lab&branch=main&mainModule=streamlit_app.py"
        );
      })();
    </script>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 28rem;
        margin: 4rem auto;
        padding: 0 1rem;
        line-height: 1.5;
        color: #0f172a;
      }
      a.btn {
        display: inline-block;
        margin-top: 1rem;
        padding: 0.65rem 1.1rem;
        background: #1565c0;
        color: #fff;
        text-decoration: none;
        border-radius: 8px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <h1>KASLU LAB</h1>
    <p>Redirecting to Streamlit deploy…</p>
    <p>
      <a
        class="btn"
        href="https://share.streamlit.io/deploy?repository=Huseynitsu/kaslu-lab&amp;branch=main&amp;mainModule=streamlit_app.py"
        >Deploy app (Streamlit Cloud)</a
      >
    </p>
    <p style="font-size: 0.85rem; color: #64748b">
      <a href="?stay=1">Stay on this page</a> ·
      <a href="http://localhost:8501">Local</a>
    </p>
  </body>
</html>
